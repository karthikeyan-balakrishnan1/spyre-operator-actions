name: 'Capture Component Logs'

on:
  workflow_call:
    inputs:
      log-directory:
        description: 'Directory to store log files'
        required: false
        type: string
        default: 'logs'
      since:
        description: 'Time duration to capture logs (e.g., 1h, 30m)'
        required: false
        type: string
        default: '1h'

jobs:
  capture-logs:
    - name: Setup log capture
      run: |
        #!/bin/bash -e

        mkdir -p ${{ inputs.log-directory }}

        # Start log capture in background, each component to a separate file
        stern spyre-operator -n spyre-operator --since=${{ inputs.since }} > ${{ inputs.log-directory }}/spyre-operator.log 2>&1 &
        stern spyre-device-plugin -n spyre-operator --since=${{ inputs.since }} > ${{ inputs.log-directory }}/spyre-device-plugin.log 2>&1 &
        stern spyre-webhook-validator -n spyre-operator --since=${{ inputs.since }} > ${{ inputs.log-directory }}/spyre-webhook-validator.log 2>&1 &
        stern spyre-health-checker -n spyre-operator --since=${{ inputs.since }} > ${{ inputs.log-directory }}/spyre-health-checker.log 2>&1 &
        stern secondary-scheduler -n openshift-secondary-scheduler-operator --since=${{ inputs.since }} > ${{ inputs.log-directory }}/secondary-scheduler.log 2>&1 &

        echo "Log capture started in background"
        echo "Log files will be saved to: ${{ inputs.log-directory }}"